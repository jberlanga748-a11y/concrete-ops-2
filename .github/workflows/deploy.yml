# One-click deploy to Fly (app.apexhq.online).
# Run it from GitHub: Actions -> "Deploy to Fly (production)" -> Run workflow.
# No terminal needed. Requires the repo secret FLY_API_TOKEN (a Fly deploy token).
name: Deploy to Fly (production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to ship to the live site'
        required: true
        default: ''

concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Guardrail: only proceed if you typed "deploy" in the confirm box.
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app concrete-ops-2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
