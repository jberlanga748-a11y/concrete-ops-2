name: Apex HQ Demo Hosted Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: demo-hosted-smoke
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-auth demo smoke
        run: npm run smoke:hosted -- --base-url=https://concrete-ops-demo.fly.dev --skip-auth --json

      - name: Run auth demo smoke when configured
        env:
          APEX_SMOKE_PASSWORD: ${{ secrets.APEX_SMOKE_PASSWORD }}
        run: |
          if [ -z "$APEX_SMOKE_PASSWORD" ]; then
            echo "APEX_SMOKE_PASSWORD is not configured; skipping auth hosted smoke."
            {
              echo "### Demo auth hosted smoke"
              echo ""
              echo ":warning: \`APEX_SMOKE_PASSWORD\` is not configured, so auth/bootstrap hosted smoke was skipped."
              echo ""
              echo "Configure it with \`docs/apex-hq-github-actions-smoke-secrets.md\` before relying on scheduled auth smoke coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm run smoke:hosted -- --base-url=https://concrete-ops-demo.fly.dev --allow-auth --json
          {
            echo "### Demo auth hosted smoke"
            echo ""
            echo ":white_check_mark: Auth/bootstrap hosted smoke ran successfully."
          } >> "$GITHUB_STEP_SUMMARY"
