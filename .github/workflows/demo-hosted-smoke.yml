name: Apex HQ Demo Hosted Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: demo-hosted-smoke
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run non-auth demo smoke
        run: |
          set -o pipefail
          npm run smoke:hosted -- --base-url=https://concrete-ops-demo.fly.dev --skip-auth --json | tee non-auth-demo-smoke-output.txt
          node scripts/hosted-smoke-summary.mjs non-auth-demo-smoke-output.txt "Demo non-auth hosted smoke"

      - name: Run auth demo smoke when configured
        env:
          APEX_SMOKE_PASSWORD: ${{ secrets.APEX_SMOKE_PASSWORD }}
        run: |
          if [ -z "$APEX_SMOKE_PASSWORD" ]; then
            echo "APEX_SMOKE_PASSWORD is not configured; skipping auth hosted smoke."
            {
              echo "### Demo auth hosted smoke"
              echo ""
              echo ":warning: \`APEX_SMOKE_PASSWORD\` is not configured, so auth/bootstrap hosted smoke was skipped."
              echo ""
              echo "Configure it with \`docs/apex-hq-github-actions-smoke-secrets.md\` before relying on scheduled auth smoke coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          npm run smoke:hosted -- --base-url=https://concrete-ops-demo.fly.dev --allow-auth --json | tee auth-demo-smoke-output.txt
          node scripts/hosted-smoke-summary.mjs auth-demo-smoke-output.txt "Demo auth hosted smoke"

      - name: Report demo smoke failure
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = "Apex HQ demo hosted smoke failed";
            const { owner, repo } = context.repo;
            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = existingIssues.data.find((issue) => issue.title === issueTitle);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Timestamp: ${new Date().toISOString()}`,
              `Workflow run: ${runUrl}`,
              "",
              "Demo smoke failed. Check the job summary and logs for the non-auth route/health table and auth smoke status.",
              "",
              "Immediate triage:",
              "```powershell",
              "Invoke-RestMethod https://concrete-ops-demo.fly.dev/api/ready",
              "npm.cmd run smoke:hosted -- --base-url=https://concrete-ops-demo.fly.dev --skip-auth --json",
              "fly status -a concrete-ops-demo",
              "fly checks list -a concrete-ops-demo",
              "fly logs -a concrete-ops-demo",
              "```",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
              });
            }

      - name: Close recovered demo smoke issue
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = "Apex HQ demo hosted smoke failed";
            const { owner, repo } = context.repo;
            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = existingIssues.data.find((issue) => issue.title === issueTitle);

            if (!existing) {
              return;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Demo hosted smoke recovered at ${new Date().toISOString()}.\n\nWorkflow run: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: "closed",
            });
