name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace
        timeout-minutes: 2
        run: git diff --check

      - name: Verify auth and signup safety
        timeout-minutes: 8
        run: |
          npm run verify:auth
          npm run verify:signup

      - name: Verify tenant, role, and package safety
        timeout-minutes: 10
        run: |
          npm run verify:users
          npm run verify:roles
          npm run verify:entitlements

      - name: Verify public intake and demo safety
        timeout-minutes: 10
        run: |
          npm run verify:docs
          npm run verify:public-request
          npm run verify:opportunity-scout
          npm run verify:demo

      - name: Verify server behavior and backup/export tooling
        timeout-minutes: 10
        run: |
          npm run verify:server
          npm run verify:backup
          npm run verify:restore

      - name: Build frontend
        timeout-minutes: 5
        run: npm run build
