name: Apex HQ Readiness Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: readiness-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check production readiness endpoints
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = "Apex HQ production readiness check failed";
            const endpoints = [
              "https://app.apexhq.online/api/ready",
              "https://concrete-ops-2.fly.dev/api/ready",
            ];

            async function sleep(ms) {
              await new Promise((resolve) => setTimeout(resolve, ms));
            }

            async function checkEndpoint(url) {
              const startedAt = Date.now();
              try {
                const response = await fetch(url, {
                  headers: { "Accept": "application/json" },
                  signal: AbortSignal.timeout(10000),
                });
                const text = await response.text();
                let payload = null;
                try {
                  payload = text ? JSON.parse(text) : null;
                } catch {
                  payload = { raw: text.slice(0, 500) };
                }
                return {
                  url,
                  ok: response.ok && payload?.ok === true && payload?.status === "ready" && payload?.checks?.database === "ok",
                  status: response.status,
                  durationMs: Date.now() - startedAt,
                  body: payload,
                };
              } catch (error) {
                return {
                  url,
                  ok: false,
                  status: 0,
                  durationMs: Date.now() - startedAt,
                  error: error instanceof Error ? error.message : String(error),
                };
              }
            }

            const attempts = [];
            for (const url of endpoints) {
              const first = await checkEndpoint(url);
              attempts.push({ attempt: 1, ...first });
              if (!first.ok) {
                await sleep(30000);
                attempts.push({ attempt: 2, ...(await checkEndpoint(url)) });
              }
            }

            const failed = endpoints.filter((url) => {
              const urlAttempts = attempts.filter((attempt) => attempt.url === url);
              return urlAttempts.length > 0 && urlAttempts.every((attempt) => !attempt.ok);
            });

            const { owner, repo } = context.repo;
            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = existingIssues.data.find((issue) => issue.title === issueTitle);

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Timestamp: ${new Date().toISOString()}`,
              `Workflow run: ${runUrl}`,
              "",
              "Readiness attempts:",
              "```json",
              JSON.stringify(attempts, null, 2),
              "```",
              "",
              "Immediate triage:",
              "```powershell",
              "Invoke-RestMethod https://app.apexhq.online/api/ready",
              "Invoke-RestMethod https://concrete-ops-2.fly.dev/api/ready",
              "fly checks list -a concrete-ops-2",
              "fly status -a concrete-ops-2",
              "fly logs -a concrete-ops-2",
              "```",
            ].join("\n");

            if (failed.length > 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: issueTitle,
                  body,
                });
              }
              core.setFailed(`Readiness failed for: ${failed.join(", ")}`);
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Readiness recovered at ${new Date().toISOString()}.\n\nWorkflow run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

            core.info("Apex HQ production readiness endpoints passed.");
